name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile every module (syntax check)
        run: |
          python -m compileall -q voiceflow_local
          echo "All modules compile."

      - name: Offline logic + security tests (no audio / OS deps)
        run: |
          pip install pytest pyyaml --quiet
          pytest

      - name: Lint (ruff)
        run: |
          pip install ruff --quiet
          ruff check .

      - name: Guard — no shell=True / os.system / eval in the codebase
        run: |
          if grep -rnE "shell\s*=\s*True|os\.system\(|[^_.]eval\(|[^_.]exec\(" voiceflow_local --include=*.py; then
            echo "::error::Unsafe shell/eval construct found"; exit 1
          fi
          echo "No unsafe shell/eval constructs."

  # Windows is the app's real target platform, but GitHub's windows-latest
  # runners are headless: no microphone, no audio device, no interactive
  # desktop session. This job can only prove the same thing the Ubuntu job
  # proves (it imports cleanly, the offline logic suite passes) — it does NOT
  # exercise mic capture, keyboard/window automation, or the tray UI. That
  # gap is closed manually before release via SMOKE_CHECKLIST.md.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile every module (syntax check)
        run: |
          python -m compileall -q voiceflow_local
          echo "All modules compile."

      - name: Offline logic tests (no audio / mic / desktop deps)
        run: |
          pip install pytest pyyaml --quiet
          pytest
